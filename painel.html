<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{--bg:#0d0b0a;--surface:#1a1615;--surface2:#231e1c;--ink:#f5efe8;--muted:#96908d;--line:#332c29;--accent:#ea5339;--accent2:#ffe71a;--pos:#2ebb22;--neg:#ff3a1a;--chartgrid:#262220;
    --display:"PP Museum",serif;--body:"Zalando Sans",system-ui,sans-serif;}
  html[data-theme=light]{--bg:#e8ded3;--surface:#faf8f6;--surface2:#f2ece4;--ink:#2b2422;--muted:#87725e;--line:#e2d5c8;--accent:#ea5339;--accent2:#c9a300;--pos:#1f8a15;--neg:#c92f14;--chartgrid:#e7ded3;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
  .topbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:30}
  .brand{font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
  .dot{width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .brandlogo{height:24px;width:auto;display:block}
  .brandlogo.dark{display:none}
  html[data-theme=light] .brandlogo.light{display:none}
  html[data-theme=light] .brandlogo.dark{display:block}
  /* splash de carregamento */
  .tendline{font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:9px;background:rgba(241,143,51,.10);border:1px solid rgba(241,143,51,.3);color:var(--accent2)}
  .cals{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;align-items:stretch}
  @media(max-width:640px){.cals{grid-template-columns:1fr}}
  .cal{display:flex;flex-direction:column}
  .calhd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
  .calnav{display:flex;align-items:center;gap:4px}
  .calnav button{width:26px;height:26px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:7px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .calnav select{height:26px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:7px;font-family:var(--body);font-size:12px;padding:0 6px;cursor:pointer}
  .cal h4{font-family:var(--display);font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .cal h4 .tot{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
  .hhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .hhead span{text-align:center;font-size:9px;color:var(--muted);text-transform:uppercase}
  .hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .hcell{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
  .hcell.empty{background:transparent!important;border:0!important}
  .hcell .hd{font-size:11px;font-weight:700;line-height:1}
  .hcell .hv{font-size:9px;line-height:1;font-weight:600}
  .hcell.best{outline:1.5px solid rgba(195,215,44,.75);outline-offset:-1px}
  .hcell.worst{outline:1.5px dashed rgba(229,86,60,.5);outline-offset:-1px}
  .daybars{display:flex;align-items:flex-end;gap:2px;height:74px;margin:12px 0 5px;overflow-x:auto}
  .daybar{flex:1;min-width:6px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer}
  .daybar .dbf{width:100%;border-radius:3px 3px 0 0;background:var(--muted);opacity:.5;transition:opacity .1s}
  .daybar:hover .dbf{opacity:.85}
  .daybar.best .dbf{background:var(--pos);opacity:1}
  .daybar.worst .dbf{background:var(--neg);opacity:.45}
  .daybar .dbl{font-size:8px;color:var(--muted);margin-top:3px}
  .daybars2{display:flex;align-items:flex-end;gap:2px;height:74px;margin:4px 0 5px;overflow-x:auto}
  .daybarslot{flex:1;min-width:9px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .dbpair{display:flex;align-items:flex-end;gap:1px;width:100%;height:100%}
  .dbf{flex:1;border-radius:2px 2px 0 0;cursor:pointer;transition:opacity .1s}
  .daybarslot:hover .dbf{opacity:.85}
  .daybarslot .dbl{font-size:8px;color:var(--muted);margin-top:3px}
  .daylegend{display:flex;gap:16px;margin:2px 0 4px;font-size:11.5px}
  .daylegend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .daylegend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .segsm{display:inline-flex;background:#101010;border:1px solid var(--line);border-radius:8px;padding:2px;margin:8px 0 4px;gap:2px}
  .segsm button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer}
  .segsm button.on{background:var(--line);color:var(--ink)}
  .hfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line2)}
  .hfeb{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .gweek{display:flex;align-items:flex-end;gap:7px;height:46px}
  .gbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .gbf{width:100%;border-radius:3px;min-height:3px}
  .gbl{font-size:9px;color:var(--faint);text-transform:uppercase}
  .hinsight{margin-top:11px;font-size:12.5px;color:var(--ink);line-height:1.5;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .hinsight b{color:var(--pos)}
  #hmtip{position:fixed;z-index:9998;background:#0c0c0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:180px;max-width:260px}
  #hmtip.on{opacity:1}

  .mgrid{display:grid;grid-template-columns:40px repeat(4,1fr);gap:7px;align-items:center}.mgrid .h{font-size:10px;color:var(--muted);text-align:center}.mgrid .rl{font-weight:600;font-size:12px}
  .err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4);color:#fecdd3;padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
  .modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .dd{position:relative}
  .ddpanel{position:absolute;top:112%;left:0;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:210px;max-height:300px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}.ddpanel.on{display:block}
  .ddpanel label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 3px;cursor:pointer;color:var(--ink)}
  .ddpanel .acts{display:flex;gap:8px;justify-content:space-between;margin-bottom:7px;border-bottom:1px solid var(--line);padding-bottom:7px}.ddpanel .acts a{color:var(--accent);font-size:12px;cursor:pointer}
  .diag{font-family:var(--body);font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.6}.diag b{color:var(--ink)}
  .hint{font-size:11px;color:var(--muted);margin:0 0 10px}
  .b8{grid-column:span 8}.b7{grid-column:span 7}.b6{grid-column:span 6}.b5{grid-column:span 5}.b4{grid-column:span 4}
  @media(max-width:1000px){#board{grid-template-columns:1fr}.block,.b8,.b7,.b6,.b5,.b4{grid-column:span 1!important}.kgrid{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:1fr}}
  @media(max-width:560px){.kgrid{grid-template-columns:1fr 1fr}.wrap{margin:12px auto;padding:0 10px}canvas{max-height:210px}.kpi .val{font-size:18px}}
</style>

/* -------- CSV parsing (portado de csvSource.js) -------- */
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i+1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; } field += c; i++; continue; }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function num(s) {
  if (typeof s === 'number') return s;
  if (s == null) return 0;
  let t = String(s).replace(/R\$/gi, '').replace(/\s|\u00A0/g, '').trim();
  if (!t || t === '-') return 0;
  const hasC = t.includes(','), hasD = t.includes('.');
  if (hasC && hasD) t = t.replace(/\./g, '').replace(',', '.');
  else if (hasC) t = t.replace(',', '.');
  const v = parseFloat(t.replace(/[^\d.\-]/g, ''));
  return isNaN(v) ? 0 : v;
}
function parseDate(s) {
  if (!s) return null;
  const t = String(s).trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { let [, d, mo, y] = m; if (y.length === 2) y = '20' + y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }

  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

const limpaCanal = (s) => (s||'').replace(/\benvios\b|\bshop\b/gi, '').replace(/\s+/g, ' ').trim();

async function fetchCsvRows(rawUrl) {
  let lastErr = null;
  for (const mk of PROXIES) {
    try {
      const res = await fetch(mk(rawUrl));
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      if (text.trim().startsWith('<')) { lastErr = new Error('resposta não-CSV'); continue; }
      return parseCSV(text);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('falha ao ler a planilha');
}

async function readAdsTab(rawUrl, defaultLabel = 'TikTok') {
  if (!rawUrl) return { registros: [] };
  const rows = await fetchCsvRows(rawUrl);
  let h2 = -1;
  for (let r = 0; r < Math.min(rows.length, 6); r++) {
    const low = rows[r].map((c) => (c||'').trim().toLowerCase());
    if (low.includes('custo') || low.includes('receita')) { h2 = r; break; }
  }
  if (h2 < 0) throw new Error('Não encontrei "Custo"/"Receita" na aba de ADS.');
  const sub = rows[h2].map((c) => (c||'').trim().toLowerCase());
  const top = fillRow(rows[h2 - 1] || []);
  const cols = [];
  for (let c = 1; c < sub.length; c++) {
    const tipo = sub[c] === 'custo' ? 'custo' : sub[c] === 'receita' ? 'receita' : null;
    if (!tipo) continue;
    cols.push({ idx: c, tipo, canal: limpaCanal(top[c]) || defaultLabel });
  }
  const map = new Map();
  for (let r = h2 + 1; r < rows.length; r++) {
    const date = parseDate(rows[r][0]); if (!date) continue;
    for (const col of cols) {
      const key = date + '|' + col.canal;
      const o = map.get(key) || { date, canal: col.canal, custo: 0, receita: 0 };
      o[col.tipo] += num(rows[r][col.idx]); map.set(key, o);
    }
  }
  return { registros: [...map.values()] };
}
async function readRevenueTab(rawUrl, defaultLabel = 'TikTok') {
  if (!rawUrl) return { registros: [] };
  const rows = await fetchCsvRows(rawUrl);
  let h = 0;
  while (h < rows.length && rows[h].every((c) => !(c||'').trim())) h++;
  const header = rows[h].map((c) => (c||'').trim());
  const cols = [];
  for (let c = 1; c < header.length; c++) {
    const nome = header[c];
    if (!nome || /total|semanal/i.test(nome)) continue;
    cols.push({ idx: c, canal: /fatur/i.test(nome) ? defaultLabel : limpaCanal(nome) });
  }
  const registros = [];
  for (let r = h + 1; r < rows.length; r++) {
    const date = parseDate(rows[r][0]); if (!date) continue;
    for (const col of cols) registros.push({ date, canal: col.canal, faturamento: num(rows[r][col.idx]) });
  }
  return { registros };
}

/* -------- Faturamento Hora a Hora (snapshot intradiário gerado pelo Apps Script/Bling) -------- */
function parseDataHora(s) {
  // formato gerado pelo Apps Script: "dd/MM/yyyy HH:mm"
  const m = String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const [, d, mo, y, h, mi] = m;
  return { date: `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`, time: `${h.padStart(2,'0')}:${mi}` };
}
async function readHoraHoraTab(rawUrl) {
  if (!rawUrl) return { linhas: [], canais: [] };
  const rows = await fetchCsvRows(rawUrl);
  if (!rows.length) return { linhas: [], canais: [] };
  const header = rows[0].map((c) => (c||'').trim());
  // colunas identificadas pelo NOME (não pela posição) — assim, adicionar
  // "Qtd Pedidos" no fim (ou em qualquer lugar) não confunde o parser
  const idxTotal = header.indexOf('Total Geral');
  const idxQtd = header.indexOf('Qtd Pedidos');
  const canais = header.filter((h, i) => i > 0 && i !== idxTotal && i !== idxQtd);
  const linhas = [];
  for (let r = 1; r < rows.length; r++) {
    const dh = parseDataHora(rows[r][0]);
    if (!dh) continue;
    const porCanal = {};
    canais.forEach((canal) => { porCanal[canal] = num(rows[r][header.indexOf(canal)]); });
    const total = idxTotal >= 0 ? num(rows[r][idxTotal]) : 0;
    const qtdPedidos = idxQtd >= 0 ? num(rows[r][idxQtd]) : null;
    linhas.push({ date: dh.date, time: dh.time, porCanal, total, qtdPedidos });
  }
  return { linhas, canais };
}

function diagTab(reg,tipo){

async function buildAnalytics({ de, ate, gran='dia', nivel, canais, compara='mes' } = {}) {

  let ads=[...adsR.registros,...adsT.registros];

  // esses — independente do período selecionado no topo do painel, pra

  const janela=(d0,d1)=>{const a=new Date(hoje);a.setDate(a.getDate()-d0);const b=new Date(hoje);b.setDate(b.getDate()-d1);return {ini:isoLocal(a),fim:isoLocal(b)};};
  const jRec=janela(7,1),jAnt=janela(14,8);

  const mesVigente=(hoje.getFullYear()===anoRef)?(hoje.getMonth()+1):13;
  const diaOntem=ontem.getDate();
  const fatMesAno=(ano,m,capDia)=>soma(rev.filter(x=>setC.has(x.canal)&&yOf(x.date)===ano&&mOf(x.date)===m&&(!capDia||dOf(x.date)<=capDia)),'faturamento');
  const comparativoMensal=MES.map((nome,i)=>{const m=i+1;const cap=(m===mesVigente)?diaOntem:null;const atual=fatMesAno(anoRef,m,cap);const anterior=fatMesAno(anoRef-1,m,cap);return {label:nome,atual:r2(atual),anterior:r2(anterior),var:pct(atual,anterior)};});

  function enumDates(d1,d2){const out=[];let d=new Date(d1+'T00:00:00');const end=new Date(d2+'T00:00:00');let g=0;while(d<=end&&g++<3700){out.push(isoLocal(d));d.setDate(d.getDate()+1);}return out;}

    atual:{ano:curY,mes:curM,label:MES[curM-1],firstDow:new Date(curY,curM-1,1).getDay(),dias:hmA,total:r2(hmA.reduce((a,x)=>a+(x.fat||0),0))},
    anterior:{ano:hmPmY,mes:hmPmM,label:MES[hmPmM-1],firstDow:new Date(hmPmY,hmPmM-1,1).getDay(),dias:hmB,total:r2(hmB.reduce((a,x)=>a+(x.fat||0),0))}};
  const inQ=(x)=>yOf(x.date)===curY&&triOf(mOf(x.date))===curQcal&&x.date<=ateMes;
  const revQ=revF.filter(inQ),adsQ=adsF.filter(inQ);
  const fQ=r2(soma(revQ,'faturamento')),iQ=r2(soma(adsQ,'custo')),rcQ=r2(soma(adsQ,'receita'));
  const resumoQuarter={quarter:'Q'+curQcal,meta:r2(metaQcurCal),faturamento:fQ,investimento:iQ,receitaAds:rcQ,roas:iQ?r2(fQ/iQ):null,atingidoPct:metaQcurCal?r2(fQ/metaQcurCal*100):null};

  const projPctSem=metaMesAjust?projetadoMesP/metaMesAjust*100:null;
  let semStatus='cinza',semLabel='sem meta definida';
  if(projPctSem!=null){if(projPctSem>=100){semStatus='verde';semLabel='No ritmo p/ bater a meta';}else if(projPctSem>=85){semStatus='amarelo';semLabel='Um pouco atrás da meta';}else{semStatus='vermelho';semLabel='Atrás da meta';}}
  const semaforo={status:semStatus,label:semLabel,projPct:projPctSem!=null?r2(projPctSem):null,mesLabel:MES[pRefM-1]};

  const acReal=[],acMeta=[];let sR=0,sM=0;
  for(let i=0;i<ndCur;i++){sM+=metaDiaSeason[i]||0;acMeta.push(r2(sM));if(i<capDiaCur){sR+=serieAtu[i]||0;acReal.push(r2(sR));}else acReal.push(null);}
  const acProj=Array(ndCur).fill(null);let sP=sR;if(capDiaCur>=1)acProj[capDiaCur-1]=r2(sR);
  for(let i=capDiaCur;i<ndCur;i++){sP+=projetadoMesP*(wDay[i]||0);acProj[i]=r2(sP);}
  const acumulado={labels:projLabels,realizado:acReal,meta:acMeta,projecao:acProj,metaTotal:metaMesAjust};

  const anoLY=anoRef-1;
  const historicoLY={ano:anoLY,trimestres:[1,2,3,4].map(q=>({q:'Q'+q,total:r2(soma(revF.filter(x=>yOf(x.date)===anoLY&&triOf(mOf(x.date))===q),'faturamento'))})),meses:MES.map((nome,i)=>({mes:nome,total:r2(soma(revF.filter(x=>yOf(x.date)===anoLY&&mOf(x.date)===i+1),'faturamento'))}))};

  // Alerta de queda anômala por canal: compara ONTEM com a média histórica
  // desse MESMO dia da semana, pra aquele canal — diferente de "abaixo de
  // ontem", isso pega quando o canal está fora do padrão normal dele (ex:

    const valOntem=porDia.get(ontemISOc)||0;

    });
    if(n<3)return;

    if(pctAbaixo>=30)alertasQueda.push({canal,ontem:r2(valOntem),media:r2(media),pctAbaixo,diaSemana:DIAS_SEMANA[dowOntem]});
  });
  alertasQueda.sort((a,b)=>b.pctAbaixo-a.pctAbaixo);

  return {
    configurado:Boolean(cfg.urls.adsRenova||cfg.urls.retroRenova||cfg.urls.adsTiktok||cfg.urls.retroTiktok),
    periodo:{de,ate:(maxData&&ate&&ate>maxData)?maxData:ate,gran,compara},anoRef,anosDisponiveis:anos,maxData,

    erros,diagnostico:diag,
    cards:{faturamentoPeriodo:r2(faturamentoPeriodo),crescimentoPeriodo,comparaLabel,investimento:r2(investimento),receitaAds:r2(receitaAds),roasGeral,metaRoas:Number(cfg.metas.roas)||0,roasAtingido:(Number(cfg.metas.roas)||0)?(roasGeral!=null&&roasGeral>=cfg.metas.roas):null,triAtual,metaAnual:r2(metaAnual),atingimentoAnual,faturamentoAno:r2(faturamentoAno),faltaAnual:metaAnual?r2(Math.max(metaAnual-faturamentoAno,0)):null},
    porCanal,roasPorCanal,trimestres,tabelaMetas,realizadoTri:realTri,comparativoMensal,
    pace,comparativoAnos,totaisAnuais,evolucaoAno,canaisComp,comparativoInsights,tendencia,
    evolucao,evolucaoInvest,evolucaoCanal,roasDiario,projecao,metasResumo,
    resumoMes,resumoQuarter,semaforo,acumulado,historicoLY,heatmap,mesCompleto,fechamento,alertasQueda,
  };
}

function desCanal(pc){

const RANGE_LBL={mes:'Mês vigente',ultmes:'Último mês',ano:'Este ano',anoant:'Ano passado','30d':'Últimos 30 dias',tudo:'Período completo',q1:'Q1',q2:'Q2',q3:'Q3',q4:'Q4'};
function fmtBR(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'—';}
function atualizaShowing(tipo){const el=document.getElementById('showing');if(!el)return;const nome=RANGE_LBL[tipo]||'Período personalizado';const de=state.de||(document.getElementById('de')||{}).value;const ate=state.ate||(document.getElementById('ate')||{}).value;const nc=(state.canais&&state.canais.length)?state.canais.length:(canaisDisp.length||0);el.innerHTML=`Mostrando: <span class="cor">${nome}</span> · <b>${fmtBR(de)}</b> até <b>${fmtBR(ate)}</b>${nc?` · <b>${nc} ${nc===1?'canal':'canais'}</b>`:''}`;}
function setRange(tipo){marcaRange(tipo);const ey=anos[anos.length-1]||new Date().getFullYear();const hoje=new Date();const ontem=new Date(hoje);ontem.setDate(ontem.getDate()-1);const isoD=isoLocal;const pad=n=>String(n).padStart(2,'0');
  if(tipo==='mes'){state.de=isoD(new Date(hoje.getFullYear(),hoje.getMonth(),1));state.ate=isoD(ontem);}
  else if(tipo==='ultmes'){const pmDate=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);const y=pmDate.getFullYear(),m=pmDate.getMonth();state.de=isoD(new Date(y,m,1));state.ate=isoD(new Date(y,m+1,0));}
  else if(tipo==='ano'){state.de=ey+'-01-01';state.ate=(maxData&&+maxData.slice(0,4)===ey)?maxData:ey+'-12-31';}
  else if(tipo==='anoant'){state.de=(ey-1)+'-01-01';state.ate=(ey-1)+'-12-31';}
  else if(tipo==='30d'){const e=maxData||isoD(hoje);const dt=new Date(e);dt.setDate(dt.getDate()-29);state.de=isoD(dt);state.ate=e;}
  else if(tipo==='tudo'){state.de=(anos[0]||ey)+'-01-01';state.ate=maxData||ey+'-12-31';}
  else if(/^q[1-4]$/.test(tipo)){const y=state.ate?+state.ate.slice(0,4):ey;const q=+tipo[1];const last=new Date(y,q*3,0).getDate();state.de=`${y}-${pad((q-1)*3+1)}-01`;state.ate=`${y}-${pad(q*3)}-${pad(last)}`;}
  carregar();}

function copiarResumo(){if(!ultData)return;
  if(ultData.mesCompleto&&ultData.fechamento){const fc=ultData.fechamento;
    const fmtC=n=>{const a=Math.abs(n);const sg=n<0?'-':'';return a>=1e6?sg+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' mi':'R$ '+sg+Math.round(a/1e3)+' mil';};
    const emoji=fc.atingidoPct>=100?'🟢':fc.atingidoPct>=85?'🟠':'🔴';
    const stTxt=fc.atingidoPct>=100?'Meta batida':fc.atingidoPct>=85?'Perto da meta':'Abaixo da meta';
    const now=new Date();const dd=String(now.getDate()).padStart(2,'0'),mo=String(now.getMonth()+1).padStart(2,'0'),hh=String(now.getHours()).padStart(2,'0'),mi=String(now.getMinutes()).padStart(2,'0');
    const L=[];
    L.push('*📊 Renova Be — Fechamento de '+fc.mesLabel+' '+fc.ano+'*');
    L.push('');
    L.push('*Faturado:* '+fmtC(fc.faturado)+' de '+fmtC(fc.meta)+' _(meta do mês)_');
    L.push('*Atingido:* '+emoji+' '+(fc.atingidoPct!=null?fc.atingidoPct.toFixed(0)+'%':'—')+' · '+stTxt);
    if(fc.falta>0) L.push('*Ficou abaixo:* '+fmtC(fc.falta)); else if(fc.sobra>0) L.push('*Superou em:* '+fmtC(fc.sobra));
    if(fc.vsMesAntCheio!=null) L.push('*vs '+fc.mesAntLabel+' (mês cheio):* '+(fc.vsMesAntCheio>0?'+':'')+fc.vsMesAntCheio.toFixed(0)+'%');
    L.push('');
    if(fc.niveisMes&&fc.niveisMes.length){L.push('*Níveis do mês:*');for(const x of fc.niveisMes){L.push('  '+x.nivel+': '+(x.atingido?'✔️ atingido':'faltou '+fmtC(x.falta)));}L.push('');}
    if(fc.quarters&&fc.quarters.length){L.push('*Trimestres '+fc.ano+':*');for(const x of fc.quarters){const st=[];if(x.emAndamento)st.push('em andamento');st.push(x.nivelAtingido?'atingiu '+x.nivelAtingido:'abaixo de M1');if(x.proxNivel)st.push('faltou '+fmtC(x.faltaProx)+' p/ '+x.proxNivel);L.push('  Q'+x.q+': '+fmtC(x.real)+' / '+fmtC(x.meta)+' ('+(x.pct!=null?x.pct.toFixed(0)+'%':'—')+') · '+st.join(' · '));}L.push('');}
    if(fc.anoMeses&&fc.anoMeses.length){L.push('*Faturamento do ano (Jan a '+fc.mesLabel+'):*');for(const r of fc.anoMeses){L.push('  '+r.mes+': '+fmtC(r.fat)+' / '+fmtC(r.meta)+' ('+(r.pct!=null?r.pct.toFixed(0)+'%':'—')+')');}L.push('  *Total:* '+fmtC(fc.totalAno)+' / '+fmtC(fc.metaAno)+' ('+(fc.pctAno!=null?fc.pctAno.toFixed(0)+'%':'—')+')');L.push('');}
    L.push('*ROAS:* '+(fc.roas!=null?fc.roas.toFixed(2).replace('.',','):'—')+'  ·  *Invest.:* '+fmtC(fc.investimento)+'  ·  *Receita ADS:* '+fmtC(fc.receitaAds));
    L.push('_Fechamento gerado em '+dd+'/'+mo+' às '+hh+':'+mi+'_');
    const t=L.join('\n');
    const done=()=>{const b=document.getElementById('btnCopiar');if(b){const o=b.textContent;b.textContent='✅ Copiado!';setTimeout(()=>b.textContent=o,1500);}};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>prompt('Copie o resumo:',t));}else prompt('Copie o resumo:',t);
    return;
  }
  const r=ultData.resumoMes,pj=ultData.projecao.projecaoMes,s=ultData.semaforo,q=ultData.resumoQuarter,mm=ultData.projecao.mesesMeta||[];
  const cfg=getConfig(),niveis=cfg.metas.niveis,principal=cfg.metas.nivelPrincipal;
  const fmtC=n=>{const a=Math.abs(n);const sg=n<0?'-':'';return a>=1e6?sg+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' mi':'R$ '+sg+Math.round(a/1e3)+' mil';};
  const mesNum=pj.mesNum,quarter=Math.ceil(mesNum/3),posInQ=(mesNum-1)%3,lastOfQ=posInQ===2;
  const baseLvl=L=>((niveis[L]&&niveis[L]['q'+quarter])||0)/3;
  let accum=0; for(const m of mm){ if(m.mesNum<mesNum) accum+=(m.meta-m.realizado); }
  // Usa o total FECHADO até ontem (o mesmo dado já usado no card "Faturamento
  // por dia", que sempre corta em ontem) em vez do total ao vivo — o resumo
  // compartilhado não deve incluir o parcial de hoje, que ainda está em aberto.
  const chaveMesAtualHm=ultData.heatmap&&ultData.heatmap.chaveAtual;
  const diasFechadosMes=(chaveMesAtualHm&&ultData.heatmap.meses[chaveMesAtualHm])||[];
  const temDiasFechados=diasFechadosMes.some(x=>x.fat!=null);
  const realMes=temDiasFechados?diasFechadosMes.reduce((s,x)=>s+(x.fat>0?x.fat:0),0):r.faturamento;
  const diasFechadosCount=temDiasFechados?diasFechadosMes.filter(x=>x.fat!=null).length:pj.diasDecorridos;
  const diasRestFechado=Math.max(pj.diasMes-diasFechadosCount,1);
  const diasRest=Math.max(pj.diasMes-pj.diasDecorridos,1);
  const metaPrincMes=baseLvl(principal)+accum;
  const emoji=s.status==='verde'?'🟢':s.status==='amarelo'?'🟠':s.status==='vermelho'?'🔴':'⚪';
  // meta do mês (discriminada se houver acúmulo)
  let metaMesStr=fmtC(metaPrincMes);
  if(Math.abs(accum)>1){ metaMesStr=fmtC(metaPrincMes)+' ('+fmtC(baseLvl(principal))+' base '+(accum>0?'+ '+fmtC(accum)+' acúmulo':'− '+fmtC(-accum)+' superávit')+')'; }
  // níveis: falta este mês + /dia; marca mais próxima e atingidos
  const ordem=['M1','M2','M3','M4'].filter(L=>niveis[L]);
  const faltas=ordem.map(L=>({L,falta:(baseLvl(L)+accum)-realMes}));
  const positivas=faltas.filter(x=>x.falta>0).sort((a,b)=>a.falta-b.falta);
  const maisProx=positivas.length?positivas[0].L:null;
  const linhasNiveis=faltas.map(x=>{
    if(x.falta<=0) return '• *'+x.L+'* — ✔️ atingido _(superou '+fmtC(-x.falta)+')_';
    return '• *'+x.L+'* — falta *'+fmtC(x.falta)+'* · '+fmtC(x.falta/diasRest)+'/dia'+(x.L===maisProx?' ✅ _mais próxima_':'');
  });
  // tendência (⚠️/✅)
  const faltaProj=metaPrincMes-pj.projetado;
  const proxMes=MES[mesNum%12];
  let tend='';
  if(!lastOfQ){
    tend = faltaProj>0 ? '⚠️ _No ritmo atual, deve faltar ~'+fmtC(faltaProj)+' → acúmulo estimado p/ '+proxMes+'_'
                       : '✅ _No ritmo atual, deve sobrar ~'+fmtC(-faltaProj)+' → abate na meta de '+proxMes+'_';
  } else {
    tend = faltaProj>0 ? '⚠️ _No ritmo atual, o '+q.quarter+' deve fechar ~'+fmtC(faltaProj)+' abaixo da meta_'
                       : '✅ _No ritmo atual, o '+q.quarter+' deve fechar ~'+fmtC(-faltaProj)+' acima da meta_';
  }
  const now=new Date();const dd=String(now.getDate()).padStart(2,'0'),mo=String(now.getMonth()+1).padStart(2,'0'),hh=String(now.getHours()).padStart(2,'0'),mi=String(now.getMinutes()).padStart(2,'0');
  const L=[];
  L.push('*📊 Renova Be — Painel ADS*');
  L.push('_'+r.mesLabel+' · até dia '+diasFechadosCount+' (fechado) · faltam '+diasRestFechado+' dias_');
  L.push('');
  L.push('*Faturado no mês (até ontem):* '+fmtC(realMes)+' de '+metaMesStr+' _(meta '+principal+' do mês)_');
  L.push('*Projeção de fim do mês:* '+fmtC(pj.projetado));
  L.push('*Status:* '+emoji+' '+s.label);
  L.push(tend);
  L.push('');
  L.push('*🎯 Falta este mês por nível*');
  L.push('_meta do mês = base do trimestre ÷ 3'+(Math.abs(accum)>1?' '+(accum>0?'+ acúmulo':'− superávit'):'')+'_');
  for(const ln of linhasNiveis) L.push(ln);
  L.push('');
  L.push('*📊 Acumulado do trimestre ('+q.quarter+')*');
  L.push('Realizado: '+fmtC(q.faturamento)+' de '+fmtC(q.meta)+' ('+principal+')'+(q.atingidoPct!=null?' · '+q.atingidoPct.toFixed(0)+'%':''));
  L.push('');
  L.push('*ROAS:* '+(r.roas!=null?r.roas.toFixed(2).replace('.',','):'—')+'  ·  *Invest.:* '+fmtC(r.investimento)+'  ·  *Receita ADS:* '+fmtC(r.receitaAds));
  L.push('_Atualizado em '+dd+'/'+mo+' às '+hh+':'+mi+'_');
  const t=L.join('\n');
  const done=()=>{const b=document.getElementById('btnCopiar');if(b){const o=b.textContent;b.textContent='✅ Copiado!';setTimeout(()=>b.textContent=o,1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>prompt('Copie o resumo:',t));}else prompt('Copie o resumo:',t);}

/* -------- Faturamento Hora a Hora: card ao vivo + aba dedicada (independente do motor principal) -------- */
let horaHoraCache={linhas:[],canais:[]};let hhChart=null;let hhChartRitmo=null;
// Traduz os nomes de canal do Bling/Hora a Hora pros mesmos nomes usados no
// filtro "Canais" geral do painel (que vêm do cabeçalho do CSV Retroativo).
// TikTok, Amazon, Magalu e Shein já usam o mesmo nome nos dois lados.
const HH_PARA_PAINEL={'Meli MG':'Mercado Livre MG','Meli MG Full':'Mercado Livre MG','Meli Guarulhos':'Mercado Livre Gru','Shopee':'Shopee MG'};
function totalCanais(linha,canais){return canais.reduce((s,c)=>s+(linha.porCanal[c]||0),0);}
// Usa a MESMA seleção do filtro "Canais" geral do painel (state.canais) —
// sem filtro próprio pro Hora a Hora, pra não ter dois lugares diferentes
// controlando a mesma coisa.
function canaisAtivos(){
  const todos=horaHoraCache.canais||[];
  if(state.canais&&state.canais.length){
    const selecionados=new Set(state.canais);
    return todos.filter(c=>selecionados.has(HH_PARA_PAINEL[c]||c));
  }
  // sem seleção explícita: mesma regra padrão do resto do painel (tudo, exceto TikTok)
  return todos.filter(c=>!String(c).toLowerCase().includes('tiktok'));
}
function hojeISO(){return isoLocal(new Date());}
function ontemISO(){const d=new Date();d.setDate(d.getDate()-1);return isoLocal(d);}
// Meta do dia: reaproveita a mesma convenção já usada no resto do painel
// (meta mensal = meta do trimestre / 3), dividida pelos dias do mês atual
function metaDoDia(){
  const cfg=getConfig();
  const nivel=cfg.metas.nivelPrincipal;
  const hoje=new Date();
  const quarter=Math.ceil((hoje.getMonth()+1)/3);
  const metaQuarter=Number((cfg.metas.niveis[nivel]||{})['q'+quarter])||0;
  const metaMes=metaQuarter/3;
  const diasNoMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
  return diasNoMes?metaMes/diasNoMes:0;
}
// Canal com maior variação % hoje vs ontem, no mesmo horário (fixo em "ontem"
// pra ser um destaque estável, independente do que estiver selecionado nos
// seletores de comparação da aba)
function maiorAltaDia(){
  const linhasHoje=(horaHoraCache.linhas||[]).filter(l=>l.date===hojeISO());
  const linhasOntem=(horaHoraCache.linhas||[]).filter(l=>l.date===ontemISO());
  if(!linhasHoje.length||!linhasOntem.length)return null;
  const ultima=linhasHoje[linhasHoje.length-1];
  const grade=gradeCompleta();
  const idxHora=idxNaGrade(ultima.time);
  if(idxHora<0)return null;
  const canais=canaisAtivos();
  let melhor=null;
  canais.forEach(c=>{
    const vHoje=ultima.porCanal[c]||0;
    const vOntem=projetarNaGrade(grade,linhasOntem,l=>l.porCanal[c]||0)[idxHora]||0;
    if(vOntem<1)return; // evita ruído/divisão por zero em canais quase sem histórico
    const diff=(vHoje-vOntem)/vOntem*100;
    if(!melhor||diff>melhor.diff)melhor={canal:c,diff};
  });
  return melhor;
}
// Receita POR hora (não acumulada) — revela em que horário do dia mais entra
// faturamento, algo que a curva acumulada esconde
function deltasPorHora(linhas,canais){
  const grade=gradeCompleta();
  const serie=projetarNaGrade(grade,linhas,l=>totalCanais(l,canais),true);
  const porHora=new Array(24).fill(null);
  for(let h=0;h<24;h++){
    let v=null;
    for(let k=11;k>=0;k--){const idx=h*12+k;if(serie[idx]!=null){v=serie[idx];break;}}
    porHora[h]=v;
  }
  const deltas=new Array(24).fill(null);
  let anterior=0;
  for(let h=0;h<24;h++){
    if(porHora[h]==null){deltas[h]=null;continue;}
    deltas[h]=Math.max(0,porHora[h]-anterior);
    anterior=porHora[h];
  }
  return deltas;
}
// Ranking de canais com barra proporcional + variação vs um dia de referência.
// Compartilhado entre o card ao vivo (sempre compara com "ontem") e a aba
// dedicada (compara com o que estiver selecionado nos seletores).
function rankingHtml(canais,linhasP,linhasC,opts){
  opts=opts||{};
  if(!linhasP.length)return '<div class="empty">Sem dados ainda.</div>';
  const ultimaP=linhasP[linhasP.length-1];
  const horaP=ultimaP.time;
  let valoresC=null;
  if(linhasC&&linhasC.length){
    const grade=gradeCompleta();
    const idxHora=idxNaGrade(horaP);
    if(idxHora>=0){
      valoresC={};
      canais.forEach(c=>{valoresC[c]=projetarNaGrade(grade,linhasC,l=>l.porCanal[c]||0)[idxHora]||0;});
    }
  }
  let linhas=canais.map((c,i)=>({canal:c,i,valor:ultimaP.porCanal[c]||0}))
    .filter(v=>v.valor>0||(valoresC&&valoresC[v.canal]>0))
    .sort((a,b)=>b.valor-a.valor);
  if(opts.limite)linhas=linhas.slice(0,opts.limite);
  const maxValor=Math.max(1,...linhas.map(v=>v.valor));
  const linhasHtml=linhas.map(v=>{
    const pct=Math.max(2,Math.round(v.valor/maxValor*100));
    let deltaHtml='';
    if(valoresC){
      const vc=valoresC[v.canal]||0;
      const diff=vc?((v.valor-vc)/vc*100):(v.valor>0?100:null);
      if(diff!=null){
        const cls=diff>=0?'up':'down';
        deltaHtml=`<span class="hh-rank-delta ${cls}">${diff>=0?'+':''}${diff.toFixed(0)}%</span>`;
      }
    }
    return `<div class="hh-rank-row">
      <span class="hh-rank-name"><span class="hh-dot" style="background:${cor(v.canal,v.i)}"></span>${v.canal}</span>
      <span class="hh-rank-bar"><span class="hh-rank-fill" style="width:${pct}%;background:${cor(v.canal,v.i)}"></span></span>
      <span class="hh-rank-valor num">${comp(v.valor)}</span>
      ${deltaHtml}
    </div>`;
  }).join('');
  const canaisTotais=canais.map((c,i)=>({canal:c,i,valor:ultimaP.porCanal[c]||0})).filter(v=>v.valor>0||(valoresC&&valoresC[v.canal]>0));
  const oculto=opts.limite&&canaisTotais.length>opts.limite?`<div class="hh-rank-mais">+ ${canaisTotais.length-opts.limite} outro(s) canal(is) — veja tudo na aba Hora a Hora</div>`:'';
  return linhasHtml+oculto;
}

function diasDisponiveis(){
  const set=new Set((horaHoraCache.linhas||[]).map(l=>l.date));
  return [...set].sort().reverse(); // mais recente primeiro
}
function fmtDiaLabel(iso){
  const [y,m,d]=iso.split('-');
  const hojeStr=hojeISO();
  const ontem=new Date();ontem.setDate(ontem.getDate()-1);
  const ontemStr=isoLocal(ontem);
  if(iso===hojeStr)return `${d}/${m}/${y} (hoje)`;
  if(iso===ontemStr)return `${d}/${m}/${y} (ontem)`;
  return `${d}/${m}/${y}`;
}
// (a antiga gradeHorarios foi substituída pela gradeCompleta, que sempre
// cobre o dia inteiro — necessário pra desenhar a linha de projeção no futuro)
// Projeta uma série na grade de horários, carregando o último valor conhecido
// (dados são acumulados no dia). Com truncar=true, não estende o último valor
// pro futuro além do último ponto real — fica em branco (útil pra não fazer
// a linha do dia em andamento parecer "achatada" depois do horário atual).
function projetarNaGrade(grade,linhas,extrator,truncar){
  const ordenadas=[...linhas].sort((a,b)=>a.time.localeCompare(b.time));
  if(!ordenadas.length)return grade.map(()=>truncar?null:0);
  const ultimoTempo=ordenadas[ordenadas.length-1].time;
  let idx=0,ultimo=0;
  return grade.map(t=>{
    if(truncar&&t>ultimoTempo)return null;
    while(idx<ordenadas.length&&ordenadas[idx].time<=t){ultimo=extrator(ordenadas[idx]);idx++;}
    return ultimo;
  });
}
// Grade fixa do dia inteiro (00:00 a 23:55, de 5 em 5 min) — usada tanto pro
// eixo do gráfico quanto pro cálculo do perfil típico de acumulação
function gradeCompleta(){
  const g=[];
  for(let t=0;t<1440;t+=5)g.push(String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'));
  return g;
}
// Acha o índice do horário na grade de 5 em 5 min SEM depender de bater
// exatamente com um múltiplo de 5 — o Apps Script não garante que o gatilho
// dispare no minuto redondo (pode gravar "13:56" em vez de "13:55"), então
// grade.indexOf(hora) pode falhar silenciosamente e voltar tudo zerado.
// Aqui calculamos matematicamente qual "balde" de 5 min aquele horário cai.
function idxNaGrade(horaStr){
  const m=String(horaStr||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return -1;
  const minutos=(+m[1])*60+(+m[2]);
  return Math.min(287,Math.max(0,Math.floor(minutos/5)));
}
// Um dia só entra como referência pro perfil típico se teve registro tarde
// o suficiente (>=23:30) — ou seja, se o dia realmente "fechou" no sistema
function diasCompletos(){
  const ultimoPorDia={};
  (horaHoraCache.linhas||[]).forEach(l=>{
    if(!ultimoPorDia[l.date]||l.time>ultimoPorDia[l.date].time)ultimoPorDia[l.date]=l;
  });
  return Object.keys(ultimoPorDia).filter(d=>ultimoPorDia[d].time>='23:30'&&totalCanais(ultimoPorDia[d],canaisAtivos())>0);
}
// Perfil típico: pra cada horário do dia, qual fração (0 a 1) do faturamento
// final já costuma ter entrado, em média, nos dias de referência informados
function perfilTipico(diasRef,canais){
  const grade=gradeCompleta();
  const soma=new Array(grade.length).fill(0);
  const contagem=new Array(grade.length).fill(0);
  diasRef.forEach(d=>{
    const linhasDia=(horaHoraCache.linhas||[]).filter(l=>l.date===d);
    if(!linhasDia.length)return;
    const finalTotal=totalCanais(linhasDia[linhasDia.length-1],canais);
    if(!finalTotal)return;
    const proj=projetarNaGrade(grade,linhasDia,l=>totalCanais(l,canais));
    proj.forEach((v,i)=>{if(v!=null){soma[i]+=v/finalTotal;contagem[i]++;}});
  });
  return grade.map((t,i)=>contagem[i]?soma[i]/contagem[i]:null);
}
// Projeta o fechamento do dia informado (tipicamente "hoje"), usando o
// perfil típico dos demais dias completos como referência
function projetarFechamento(diaAlvo){
  const canais=canaisAtivos();
  const diasRef=diasCompletos().filter(d=>d!==diaAlvo);
  if(diasRef.length<1)return null;
  const linhasAlvo=(horaHoraCache.linhas||[]).filter(l=>l.date===diaAlvo);
  if(!linhasAlvo.length)return null;
  const ultima=linhasAlvo[linhasAlvo.length-1];
  if(ultima.time>='23:30')return null; // dia já fechado, não faz sentido projetar
  const perfil=perfilTipico(diasRef,canais);
  const idxAtual=idxNaGrade(ultima.time);
  if(idxAtual<0)return null;
  const fracaoAtual=perfil[idxAtual];
  if(!fracaoAtual||fracaoAtual<0.02)return null; // cedo demais pra confiar
  const totalAtual=totalCanais(ultima,canais);
  return{projecao:totalAtual/fracaoAtual,baseDias:diasRef.length,horaAtual:ultima.time,totalAtual,perfil};
}

let hhDiaPrincipal=null,hhDiaComparar=null;
function renderHoraHoraPanel(){
  const el=document.getElementById('horaHoraPanel');if(!el)return;

    return;
  }
  if(!hhDiaPrincipal||!dias.includes(hhDiaPrincipal))hhDiaPrincipal=dias[0];

  const linhasC=hhDiaComparar?(horaHoraCache.linhas||[]).filter(l=>l.date===hhDiaComparar):[];
  const grade=gradeCompleta();
  const proj=projetarFechamento(hhDiaPrincipal);
  const metaDia=metaDoDia();
  const maiorAlta=maiorAltaDia();

  // -------- cards de destaque --------
  const totalP=linhasP.length?totalCanais(linhasP[linhasP.length-1],canais):0;

  let variacaoHtml='<span class="hh-stat-sub">sem comparação</span>';
  if(hhDiaComparar){
    const idxGrade=idxNaGrade(horaP);
    const totalCNoMesmoHorario=projetarNaGrade(grade,linhasC,l=>totalCanais(l,canais))[idxGrade]||0;
    const diff=totalCNoMesmoHorario?((totalP-totalCNoMesmoHorario)/totalCNoMesmoHorario*100):null;
    if(diff!=null){
      const cls=diff>=0?'up':'down';
      variacaoHtml=`<span class="hh-stat-sub ${cls}">${diff>=0?'+':''}${diff.toFixed(1)}% vs ${fmtDiaLabel(hhDiaComparar)}</span>`;
    }
  }
  const projHtml=proj
    ?`<div class="hh-stat"><span class="hh-stat-label">Projeção de fechamento</span><span class="hh-stat-value num">${comp(proj.projecao)}</span><span class="hh-stat-sub">baseado em ${proj.baseDias} dia${proj.baseDias>1?'s':''}${proj.baseDias<3?' · melhora com o tempo':''}</span></div>`
    :`<div class="hh-stat"><span class="hh-stat-label">Projeção de fechamento</span><span class="hh-stat-value">—</span><span class="hh-stat-sub">ainda sem dias completos suficientes</span></div>`;
  const pctMeta=metaDia?Math.min(100,Math.round(totalP/metaDia*100)):0;
  const metaHtml=metaDia
    ?`<div class="hh-stat"><span class="hh-stat-label">Meta do dia</span><span class="hh-stat-value num">${comp(metaDia)}</span><div class="hh-progress"><div class="hh-progress-fill" style="width:${pctMeta}%"></div></div><span class="hh-stat-sub">${pctMeta}% atingido até ${horaP}</span></div>`
    :`<div class="hh-stat"><span class="hh-stat-label">Meta do dia</span><span class="hh-stat-value">—</span><span class="hh-stat-sub">configure metas no menu Metas</span></div>`;
  const altaHtml=maiorAlta
    ?`<div class="hh-stat"><span class="hh-stat-label">Maior alta hoje vs ontem</span><span class="hh-stat-value">${maiorAlta.canal}</span><span class="hh-stat-sub up">+${maiorAlta.diff.toFixed(0)}%</span></div>`
    :`<div class="hh-stat"><span class="hh-stat-label">Maior alta hoje vs ontem</span><span class="hh-stat-value">—</span><span class="hh-stat-sub">sem dados de ontem pra comparar</span></div>`;
  const ultimaLinhaP=linhasP.length?linhasP[linhasP.length-1]:null;
  const qtdPedidosP=ultimaLinhaP&&ultimaLinhaP.qtdPedidos!=null?ultimaLinhaP.qtdPedidos:null;
  const ticketMedioP=(qtdPedidosP&&ultimaLinhaP.total)?ultimaLinhaP.total/qtdPedidosP:null;
  const pedidosHtml=qtdPedidosP!=null
    ?`<div class="hh-stat"><span class="hh-stat-label">Pedidos · ${fmtDiaLabel(hhDiaPrincipal)}</span><span class="hh-stat-value num">${qtdPedidosP}</span><span class="hh-stat-sub">total das duas contas</span></div>`
    :'';
  const ticketHtml=ticketMedioP!=null
    ?`<div class="hh-stat"><span class="hh-stat-label">Ticket médio</span><span class="hh-stat-value num">${comp(ticketMedioP)}</span><span class="hh-stat-sub">faturamento ÷ pedidos</span></div>`
    :'';

  el.innerHTML=`
  <div class="hh-stats">
    <div class="hh-stat"><span class="hh-stat-label">Faturamento · ${fmtDiaLabel(hhDiaPrincipal)}</span><span class="hh-stat-value num">${comp(totalP)}</span>${variacaoHtml}</div>

    ${metaHtml}
    ${altaHtml}
    ${pedidosHtml}
    ${ticketHtml}
  </div>
  <div class="card">
    <h2><span class="ttl">${H()} Canais</span><span class="tag">ordenado por faturamento — respeita o filtro "Canais" do topo</span></h2>

  document.getElementById('hhSelPrincipal').onchange=(e)=>{hhDiaPrincipal=e.target.value;hhDiaComparar=null;renderHoraHoraPanel();};
  document.getElementById('hhSelComparar').onchange=(e)=>{hhDiaComparar=e.target.value;renderHoraHoraPanel();};

  // -------- gráfico principal: só totais + meta + projeção (sem linha por canal) --------
  const ds=[];
  ds.push({label:'Total · '+fmtDiaLabel(hhDiaPrincipal),data:projetarNaGrade(grade,linhasP,l=>totalCanais(l,canais),true),borderColor:TC.ink,borderDash:[],fill:false,tension:.25,pointRadius:0,borderWidth:2.4,spanGaps:false});
  if(hhDiaComparar){
    ds.push({label:'Total · '+fmtDiaLabel(hhDiaComparar),data:projetarNaGrade(grade,linhasC,l=>totalCanais(l,canais),true),borderColor:'#7d7d7d',borderDash:[6,4],fill:false,tension:.25,pointRadius:0,borderWidth:1.5,spanGaps:false});
  }
  if(metaDia>0){
    ds.push({label:'Meta do dia',data:grade.map(()=>metaDia),borderColor:'#5b8def',borderDash:[3,3],fill:false,tension:0,pointRadius:0,borderWidth:1.3});
  }
  if(proj){
    const idxAtual=idxNaGrade(proj.horaAtual);
    ds.push({
      label:'Projeção de fechamento',
      data:grade.map((t,i)=>(i<idxAtual||proj.perfil[i]==null)?null:proj.projecao*proj.perfil[i]),
      borderColor:'#c9974e',borderDash:[1,3],fill:false,tension:.25,pointRadius:0,borderWidth:1.6,spanGaps:true,
    });
  }

  const ctx=document.getElementById('chHoraHora').getContext('2d');
  const o=baseLine();o.maintainAspectRatio=false;o.plugins.tooltip={callbacks:{label:x=>x.dataset.label+': '+comp(x.parsed.y)}};
  hhChart=new Chart(ctx,{type:'line',data:{labels:grade,datasets:ds},options:o});

  // resumo textual do horário mais recente
  const resumoEl=document.getElementById('hhResumo');
  let html=`<div>Total em ${horaP} (${fmtDiaLabel(hhDiaPrincipal)})<b>${comp(totalP)}</b></div>`;
  if(hhDiaComparar){
    const idxGrade=idxNaGrade(horaP);
    const totalCNoMesmoHorario=projetarNaGrade(grade,linhasC,l=>totalCanais(l,canais))[idxGrade]||0;
    const diff=totalCNoMesmoHorario?((totalP-totalCNoMesmoHorario)/totalCNoMesmoHorario*100):null;
    const diffTxt=diff===null?'—':(diff>=0?'+':'')+diff.toFixed(1)+'%';
    const diffClass=diff===null?'':(diff>=0?'up':'down');
    html+=`<div>No mesmo horário em ${fmtDiaLabel(hhDiaComparar)}<b>${comp(totalCNoMesmoHorario)}</b></div>`;
    html+=`<div>Variação<b class="${diffClass}">${diffTxt}</b></div>`;
  }
  resumoEl.innerHTML=html;

  // -------- gráfico de ritmo: faturamento por hora, não acumulado --------
  const horasLabel=Array.from({length:24},(_,h)=>String(h).padStart(2,'0')+'h');
  const dsRitmo=[{label:fmtDiaLabel(hhDiaPrincipal),data:deltasPorHora(linhasP,canais),backgroundColor:TC.ink,borderRadius:3}];
  if(hhDiaComparar){
    dsRitmo.push({label:fmtDiaLabel(hhDiaComparar),data:deltasPorHora(linhasC,canais),backgroundColor:'#7d7d7d',borderRadius:3});
  }
  const ctxR=document.getElementById('chRitmo').getContext('2d');
  const oR=baseLine();oR.maintainAspectRatio=false;
  oR.plugins.tooltip={callbacks:{label:x=>x.dataset.label+': '+comp(x.parsed.y)}};
  oR.scales.x.stacked=false;
  hhChartRitmo=new Chart(ctxR,{type:'bar',data:{labels:horasLabel,datasets:dsRitmo},options:oR});
}

});}
const SENHA_HASH='67bbcf0f6bc3b1a9dab958390286991f93de9b477500a4fe534f624039e9fa14';
async function sha256hex(str){const b=new TextEncoder().encode(str);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function tentarEntrar(){const el=document.getElementById('gatePass');const h=await sha256hex(el.value);if(h===SENHA_HASH){try{localStorage.setItem('painel_auth',SENHA_HASH);}catch(e){}document.getElementById('gate').remove();iniciarPainel();}else{document.getElementById('gateErr').style.display='block';el.value='';el.focus();}}
document.getElementById('gateBtn').onclick=tentarEntrar;
document.getElementById('gatePass').addEventListener('keydown',e=>{if(e.key==='Enter')tentarEntrar();});
(function(){let ok=false;try{ok=localStorage.getItem('painel_auth')===SENHA_HASH;}catch(e){}if(ok){document.getElementById('gate').remove();iniciarPainel();}else{const g=document.getElementById('gate');g.style.display='flex';document.getElementById('gatePass').focus();}})();
